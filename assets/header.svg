<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Mushfique Shahriar Aurnab — learning from imperfect signals</title>
  <desc id="desc">A dark editorial banner with a broken signal trace representing observed and missing evidence.</desc>

  <rect width="1200" height="280" fill="#111315"/>
