<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">Retro signal console</title>
  <desc id="desc">Three linked instrument panels show an irregular motion track, representation probes, and an inspectable agent workflow.</desc>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#263124" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1100" height="360" rx="8" fill="#10140f"/>
  <rect x="1" y="1" width="1098" height="358" rx="7" fill="none" stroke="#4f604b"/>
  <rect x="18" y="18" width="1064" height="324" rx="4" fill="#151b14" stroke="#2e3b2c"/>
  <rect x="18" y="18" width="1064" height="324" rx="4" fill="url(#scan)" opacity="0.34"/>

  <g font-family="'Lucida Console', 'Courier New', monospace">
    <text x="35" y="39" fill="#8fa288" font-size="11" letter-spacing="1.4">MOTION / REPRESENTATION / COORDINATION</text>
    <text x="1064" y="39" fill="#f0a642" font-size="11" text-anchor="end">SERIES / 01</text>

    <g transform="translate(34 54)">
      <rect width="560" height="246" rx="3" fill="#121711" stroke="#64765f"/>
      <text x="16" y="23" fill="#f0a642" font-size="12" font-weight="700">01  IRREGULAR MOTION TRACK</text>
      <text x="544" y="23" fill="#73866e" font-size="10" text-anchor="end">SEGMENTS / GAPS / TIME</text>

      <g transform="translate(16 37)">
        <rect width="528" height="143" fill="#0f130e" stroke="#354332"/>
        <path d="M0 35.75H528M0 71.5H528M0 107.25H528M66 0V143M132 0V143M198 0V143M264 0V143M330 0V143M396 0V143M462 0V143" stroke="#273225" stroke-width="1"/>
        <path d="M10 116 C38 112 44 79 72 85 S112 127 141 103 S168 48 198 56 S226 88 252 72" fill="none" stroke="#a4f36a" stroke-width="2.3"/>
        <path d="M302 84 C328 91 337 119 363 104 S397 45 425 57 S456 92 478 74 S505 45 518 51" fill="none" stroke="#a4f36a" stroke-width="2.3"/>
        <path d="M252 72 C269 69 284 73 302 84" fill="none" stroke="#f0a642" stroke-width="1.5" stroke-dasharray="3 7"/>
        <circle cx="252" cy="72" r="3.6" fill="#121711" stroke="#f0a642" stroke-width="1.8"/>
        <circle cx="302" cy="84" r="3.6" fill="#121711" stroke="#f0a642" stroke-width="1.8"/>
        <text x="277" y="101" fill="#f0a642" font-size="9" text-anchor="middle">NO SAMPLE</text>
        <text x="8" y="137" fill="#53644f" font-size="8">00</text>
        <text x="256" y="137" fill="#53644f" font-size="8">TIME</text>
        <text x="505" y="137" fill="#53644f" font-size="8">120</text>
      </g>

      <g transform="translate(16 196)" font-size="10">
        <rect width="165" height="31" rx="2" fill="#1d271b" stroke="#42533f"/>
        <text x="10" y="13" fill="#73866e">ALIGNMENT</text>
        <text x="10" y="25" fill="#dce6d7">gap-aware</text>
        <rect x="181" width="165" height="31" rx="2" fill="#1d271b" stroke="#42533f"/>
        <text x="191" y="13" fill="#73866e">BOUNDARIES</text>
        <text x="191" y="25" fill="#dce6d7">preserved</text>
        <rect x="362" width="166" height="31" rx="2" fill="#1d271b" stroke="#42533f"/>
        <text x="372" y="13" fill="#73866e">OUTPUT</text>
        <text x="372" y="25" fill="#dce6d7">inspectable</text>
      </g>
    </g>

    <g transform="translate(616 54)">
      <rect width="450" height="116" rx="3" fill="#121711" stroke="#64765f"/>
      <text x="16" y="23" fill="#f0a642" font-size="12" font-weight="700">02  REPRESENTATION PROBES</text>
      <g transform="translate(16 37)" font-size="9">
        <path d="M0 20H418M0 43H418M0 66H418" stroke="#283426"/>
        <text x="0" y="10" fill="#73866e">L0</text><text x="76" y="10" fill="#73866e">L1</text><text x="152" y="10" fill="#73866e">L2</text><text x="228" y="10" fill="#73866e">L3</text><text x="304" y="10" fill="#73866e">L4</text><text x="402" y="10" fill="#73866e">L5</text>
        <path d="M5 59 C57 56 74 47 112 48 S174 61 214 52 S270 27 309 35 S368 53 413 25" fill="none" stroke="#a4f36a" stroke-width="2"/>
        <path d="M5 66 C52 65 83 63 118 62 S180 59 219 58 S278 55 314 51 S373 40 413 34" fill="none" stroke="#f0a642" stroke-width="1.5" stroke-dasharray="4 4"/>
      </g>
    </g>

    <g transform="translate(616 184)">
      <rect width="450" height="116" rx="3" fill="#121711" stroke="#64765f"/>
      <text x="16" y="23" fill="#f0a642" font-size="12" font-weight="700">03  EXPERIMENT WORKFLOW</text>
      <g transform="translate(21 48)" font-size="10" text-anchor="middle">
        <path d="M56 18H126M176 18H246M296 18H366" stroke="#72866d" stroke-width="1.4"/>
        <path d="M121 14L128 18L121 22M241 14L248 18L241 22M361 14L368 18L361 22" fill="none" stroke="#72866d" stroke-width="1.4"/>
        <rect x="0" y="0" width="56" height="36" rx="2" fill="#1d271b" stroke="#4c6048"/>
        <rect x="128" y="0" width="48" height="36" rx="2" fill="#1d271b" stroke="#4c6048"/>
        <rect x="248" y="0" width="48" height="36" rx="2" fill="#1d271b" stroke="#4c6048"/>
        <rect x="368" y="0" width="56" height="36" rx="2" fill="#1d271b" stroke="#4c6048"/>
        <text x="28" y="22" fill="#dce6d7">PLAN</text>
        <text x="152" y="22" fill="#a4f36a">RUN</text>
        <text x="272" y="22" fill="#dce6d7">CHECK</text>
        <text x="396" y="22" fill="#dce6d7">TRACE</text>
      </g>
      <text x="21" y="103" fill="#73866e" font-size="9">RESULTS KEEP THEIR PROVENANCE</text>
    </g>

    <text x="35" y="326" fill="#dce6d7" font-size="11">OBSERVE  /  ALIGN  /  TEST  /  TRACE</text>
    <text x="1064" y="326" fill="#73866e" font-size="10" text-anchor="end">INPUT: IMPERFECT EVIDENCE</text>
  </g>
</svg>
